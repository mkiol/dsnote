app-id: net.mkiol.SpeechNote
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
rename-icon: dsnote
command: dsnote
build-options:
  strip: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all # AMD ROCm (/dev/kfd)
  - --filesystem=xdg-desktop
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-documents
  - --filesystem=xdg-videos
  - --env=PYTORCH_TENSOREXPR=0
  - --env=PYTHONPATH=/app/extensions/nvidia/lib/python3.13/site-packages:/app/extensions/amd/lib/python3.13/site-packages:/app/extensions/cpu/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
  - --env=LD_LIBRARY_PATH=/app/opt/intel/lib:/app/extensions/nvidia/lib:/app/extensions/amd/lib:/app/extensions/cpu/lib:/app/extensions/nvidia/cuda/lib64:/app/extensions/amd/rocm/lib:/app/extensions/amd/rocm/lib/llvm/lib:/app/extensions/amd/zluda
  - --env=OPENCL_VENDOR_PATH=/app/opt/opencl/vendors
  - --env=QT_QUICK_CONTROLS_HOVER_ENABLED=1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher # system tray icon
  - --talk-name=org.kde.klipper # advanced access to the system clipboard
cleanup:
  - /cmake
  - /etc
  - /man
  - /dummy
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/python3.13/site-packages/__pycache__
  - /lib/python3.13/site-packages/nvidia*
  - /lib/python3.13/site-packages/cmake*
  - /lib/python3.13/site-packages/git*
  - /lib/python3.13/site-packages/Git*
  - /lib/python3.13/site-packages/torch/test
  - /lib/python3.13/site-packages/torch/include
  - /lib/python3.13/site-packages/pypinyin/__pycache__
  - /lib/python3.13/site-packages/pandas/tests
  - /lib/python3.13/site-packages/torchvision*
  - /lib/python3.13/site-packages/torchvision/tests
  - /extensions/cpu/lib/python3.13/site-packages/pypinyin/__pycache__
  - /extensions/cpu/lib/python3.13/site-packages/torch/test
  - /extensions/cpu/lib/python3.13/site-packages/torch/include
  - /lib/libSPIRV*
  - /lib/libshaderc*
  - /lib/libparakeet*
  - /share/bash-completion
  - /share/cmake
  - /share/doc
  - /share/locale
  - /share/man
  - /share/pkgconfig
  - /share/runtime
  - /share/vim
  - /share/ffmpeg
  - /share/aclocal
  - /bin/spellout
  - /bin/vulkan*
  - /bin/speak*
  - /bin/xdo*
  - /bin/*.py
  - /bin/*.sh
  - /bin/xdg-
  - /bin/ct-*
  - /bin/__pycache__
  - "*.a"
  - "*.la"
add-extensions:
  net.mkiol.SpeechNote.Addon:
    directory: extensions
    no-autodownload: true
    autodelete: false
    subdirectories: true
    version: stable
    versions: stable;beta;test;master
modules:
  - name: openblas
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_WITHOUT_LAPACK=OFF
      - -DC_LAPACK=ON
      - -DDYNAMIC_ARCH=ON
      - -DBUILD_STATIC_LIBS=OFF
      - -DBUILD_SHARED_LIBS=ON
    build-options:
      no-debuginfo: true
      arch:
        x86_64:
          config-opts:
            - -DTARGET=CORE2
        aarch64:
          config-opts:
            - -DTARGET=ARMV8
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.33/OpenBLAS-0.3.33.tar.gz
        sha256: 6761af1d9f5d353ab4f0b7497be2643313b36c8f31caec0144bfef198e71e6ab

  - name: mbrola
    buildsystem: simple
    build-commands:
      - make
      - mkdir -p /app/bin
      - cp Bin/mbrola /app/bin
    sources:
      - type: archive
        url: https://github.com/numediart/MBROLA/archive/bf17e9e1416a647979ac683657a536e8ca5d880e.zip
        sha256: 5a7c02a926dc48ab6d1af0e4c8ab53fc191a7e4337de6df57b6706e140fa3087

  - name: espeak
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DENABLE_TESTS=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DUSE_MBROLA=ON
      - -DUSE_LIBSONIC=OFF
      - -DUSE_LIBPCAUDIO=OFF
      - -DUSE_SPEECHPLAYER=OFF
      - -DESPEAK_BUILD_MANPAGES=OFF
    sources:
      - type: archive
        url: https://github.com/espeak-ng/espeak-ng/archive/fbe4b3764285c35b1f035cb8d09ad9fc19f71c30.zip
        sha256: 0879c9daaea2a3777e61a5e2c6c5f2e91b312ab29c562091c99bbfd82d261bee
      - type: patch
        path: ../patches/espeak-flatpak.patch

  - name: webrtcvad
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    sources:
      - type: archive
        url: https://github.com/webrtc-mirror/webrtc/archive/ac87c8df2780cb12c74942ec8a473718c76cb5b7.zip
        sha256: 9ceb1dbd7da99ec2efd6bc18ac1004d446f51e79969203b086b4dcf0ca534c68
      - type: patch
        path: ../patches/webrtcvad.patch

  - name: libstt
    buildsystem: simple
    build-commands:
      - "chmod --recursive u+w ."
      - "cp ./libstt.so /app/lib"
      - "cp ./libkenlm.so /app/lib"
      - "cp ./libtensorflowlite.so /app/lib"
      - "cp ./libtflitedelegates.so /app/lib"
      - "cp ./coqui-stt.h /app/include"
    build-options:
      strip: true
    sources:
      - type: archive
        only-arches:
          - x86_64
        strip-components: 0
        url: https://github.com/coqui-ai/STT/releases/download/v1.1.0/native_client.tflite.Linux.tar.xz
        sha256: a6965f80cbfc92e403b2e4ab92e13650c76f131cbefb951b314df046c9e11799
      - type: archive
        only-arches:
          - aarch64
        strip-components: 0
        url: https://github.com/coqui-ai/STT/releases/download/v1.1.0/native_client.tflite.linux.aarch64.tar.xz
        sha256: 5c8ce5e4bb2d8fa55f5a6ac58103d9aee6a080369bc99cd5910d2615783e1ba3

  - name: vosk
    buildsystem: simple
    build-commands:
      - "cp ./libvosk.so /app/lib"
      - "cp ./vosk_api.h /app/include"
    build-options:
      strip: true
      no-debuginfo: true
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip
        sha256: bbdc8ed85c43979f6443142889770ea95cbfbc56cffb5c5dcd73afa875c5fbb2
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-aarch64-0.3.45.zip
        sha256: 45e95d37755deb07568e79497d7feba8c03aee5a9e071df29961aa023fd94541

  - name: onnx
    buildsystem: simple
    build-commands:
      - "cp -r --no-target-directory ./include /app/include"
      - "cp -r --no-target-directory ./lib /app/lib"
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.16.1/onnxruntime-linux-x64-1.16.1.tgz
        sha256: 53a0f03f71587ed602e99e82773132fc634b74c2d227316fbfd4bf67181e72ed
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.16.1/onnxruntime-linux-aarch64-1.16.1.tgz
        sha256: f10851b62eb44f9e811134737e7c6edd15733d2c1549cb6ce403808e9c047385

  - name: piperphonemize
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DESPEAK_NG_DIR=/app
      - -DONNXRUNTIME_DIR=/app
    sources:
      - type: archive
        url: https://github.com/rhasspy/piper-phonemize/archive/ba3cc06c5248215928821f1393b2b854a936991a.zip
        sha256: 802ccf0cb234dc848106d5b3682a2ec543f27723734e4352b49fccab8214d740
      - type: patch
        path: ../patches/piperphonemize.patch

  - name: spdlog
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    sources:
      - type: archive
        url: https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz
        sha256: d8862955c6d74e5846b3f580b1605d2428b11d97a410d86e2fb13e857cd3a744

  - name: piper
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DPIPER_PHONEMIZE_DIR=/app
      - -DSPDLOG_DIR=/app
      - -DFMT_DIR=/app
    sources:
      - type: archive
        url: https://github.com/rhasspy/piper/archive/73c04d81d5590ecc46e522de3601ce7fb29fc2be.zip
        sha256: 765086f555a3bc8550ff4700ee074de691a1ab44c12c549035ae17b6a143d27e
      - type: patch
        path: ../patches/piper.patch

  - name: ssplitcpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DSSPLIT_COMPILE_LIBRARY_ONLY=ON
      - -DSSPLIT_PREFER_STATIC_COMPILE=ON
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - type: archive
        url: https://github.com/ugermann/ssplit-cpp/archive/49a8e12f11945fac82581cf056560965dcb641e6.zip
        sha256: 31b9556e539bbd35b79d9075e1a0593233b2050c277c4058fbd290985930a39b
      - type: patch
        path: ../patches/ssplitcpp.patch

  - name: pybind11
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPYBIND11_INSTALL=ON
      - -DPYBIND11_TEST=OFF
      - -DPYBIND11_FINDPYTHON=ON
    cleanup:
      - /share
    sources:
      - type: archive
        url: https://github.com/pybind/pybind11/archive/refs/tags/v3.0.4.tar.gz
        sha256: 74b6a2c2b4573a400cafb6ecbf60c98df300cd3d0041296b913d02b2cbbb2676

  - name: rnnoise
    buildsystem: autotools
    config-opts:
      - --disable-examples
      - --disable-doc
      - --disable-shared
      - --enable-static
      - --with-pic
      # adding prefix rnnoise_ to avoid symbol collision with libopus
      - >
        CFLAGS=-Dpitch_downsample=rnnoise_pitch_downsample
        -Dpitch_search=rnnoise_pitch_search
        -Dremove_doubling=rnnoise_remove_doubling
        -D_celt_lpc=rnnoise__celt_lpc
        -Dcelt_iir=rnnoise_celt_iir
        -D_celt_autocorr=rnnoise__celt_autocorr
        -Dcompute_gru=rnnoise_compute_gru
        -Dcompute_dense=rnnoise_compute_dense
    sources:
      - type: archive
        url: https://github.com/GregorR/rnnoise-nu/archive/26269304e120499485438cd93acf5127c6908c68.zip
        sha256: 93a994a3d59cb89c005f0f861fd522fe268780dc0e2e2acea56945305ed0cbf1

  - name: boost
    buildsystem: simple
    cleanup:
      - /lib
    build-commands:
      - "./bootstrap.sh --prefix=/app"
      - "./b2 -j ${FLATPAK_BUILDER_N_JOBS} install"
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.bz2
        sha256: de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5

  - name: rhvoice
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DWITH_DATA=OFF
      - -DENABLE_MAGE=OFF
      - -DBUILD_CLIENT=OFF
      - -DBUILD_UTILS=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_SERVICE=OFF
      - -DBUILD_SPEECHDISPATCHER_MODULE=OFF
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    post-install:
      - "mkdir -p /app/share/rhvoice"
      - "cp -R data /app/share/rhvoice"
      - "cp -R config /app/share/rhvoice"
    cleanup:
      - "libboost*"
      - "libRHVoice_audio*"
      - "/share/rhvoice"
    sources:
      - type: git
        url: https://github.com/RHVoice/RHVoice.git
        commit: 6ea918afe58c3913fc763da18934c5dd78af1b6d
      - type: patch
        path: ../patches/rhvoice.patch

  - name: bergamot-fallback
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DBLAS_LIB_PATH=/app/lib/libopenblas.so
      - -DBLAS_INC_DIR=/app/include/openblas
      - -DUSE_INTRINSICS_SSE2=ON
      - -DUSE_INTRINSICS_SSE3=ON
      - -DUSE_INTRINSICS_SSE41=ON
      - -DUSE_INTRINSICS_SSE42=OFF
      - -DUSE_INTRINSICS_AVX=OFF
      - -DUSE_INTRINSICS_AVX2=OFF
      - -DUSE_INTRINSICS_AVX512=OFF
      - -DUSE_INTRINSICS_FMA=OFF
      - -DUSE_INTRINSICS_ARMV7_NEONVFPV4=OFF
      - -DUSE_INTRINSICS_ARMV7_NEON=ON
      - -DBUILD_ARCH=x86-64
      - -DBERGAMOTAPI_TARGET_NAME=bergamot_api-fallback
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/browsermt/bergamot-translator.git
        commit: ada8c3922490cc6a507bcf81fa4882b435595323
      - type: patch
        path: ../patches/bergamot.patch

  - name: bergamot
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DBLAS_LIB_PATH=/app/lib/libopenblas.so
      - -DBLAS_INC_DIR=/app/include/openblas
      - -DUSE_INTRINSICS_SSE2=ON
      - -DUSE_INTRINSICS_SSE3=ON
      - -DUSE_INTRINSICS_SSE41=ON
      - -DUSE_INTRINSICS_SSE42=ON
      - -DUSE_INTRINSICS_AVX=ON
      - -DUSE_INTRINSICS_AVX2=OFF
      - -DUSE_INTRINSICS_AVX512=OFF
      - -DUSE_INTRINSICS_FMA=OFF
      - -DUSE_INTRINSICS_ARMV7_NEON=OFF
      - -DUSE_INTRINSICS_ARMV7_NEONVFPV4=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-options:
      arch:
        x86_64:
          config-opts:
            - -DBUILD_ARCH=x86-64
        aarch64:
          config-opts:
            - -DBUILD_ARCH=armv8-a
    sources:
      - type: git
        url: https://github.com/browsermt/bergamot-translator.git
        commit: ada8c3922490cc6a507bcf81fa4882b435595323
      - type: patch
        path: ../patches/bergamot.patch

  - name: rubberband
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dauto_features=disabled
      - -Ddefault_library=static
      - -Dresampler=builtin
      - -Dfft=builtin
    sources:
      - type: archive
        url: https://breakfastquay.com/files/releases/rubberband-3.3.0.tar.bz2
        sha256: d9ef89e2b8ef9f85b13ac3c2faec30e20acf2c9f3a9c8c45ce637f2bc95e576c

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-autodetect
      - --disable-doc
      - --disable-programs
      - --disable-everything
      - --enable-static
      - --disable-shared
      - --enable-nonfree
      - --enable-gpl
      - --enable-pic
      - --enable-protocol=file
      - --enable-filter=aresample
      - --enable-filter=aformat
      - --enable-filter=amix
      - --enable-filter=anull
      - --enable-filter=volume
      - --enable-filter=rubberband
      - --enable-encoder=libmp3lame
      - --enable-encoder=libvorbis
      - --enable-encoder=pcm_s16le
      - --enable-encoder=libopus
      - --enable-encoder=flac
      - --enable-encoder=srt
      - --enable-encoder=subrip
      - --enable-encoder=ass
      - --enable-encoder=ssa
      - --enable-encoder=webvtt
      - --enable-decoder=pcm_u8
      - --enable-decoder=pcm_u32le
      - --enable-decoder=pcm_u32be
      - --enable-decoder=pcm_u24le
      - --enable-decoder=pcm_u24be
      - --enable-decoder=pcm_u16le
      - --enable-decoder=pcm_u16be
      - --enable-decoder=pcm_s8
      - --enable-decoder=pcm_s32le
      - --enable-decoder=pcm_s32be
      - --enable-decoder=pcm_s24le
      - --enable-decoder=pcm_s24be
      - --enable-decoder=pcm_s16le
      - --enable-decoder=pcm_s16be
      - --enable-decoder=pcm_f64le
      - --enable-decoder=pcm_f64be
      - --enable-decoder=pcm_f32le
      - --enable-decoder=pcm_f32be
      - --enable-decoder=aac
      - --enable-decoder=aac_fixed
      - --enable-decoder=aac_latm
      - --enable-decoder=mp3
      - --enable-decoder=mp3adu
      - --enable-decoder=mp3adufloat
      - --enable-decoder=mp3float
      - --enable-decoder=mp3on4
      - --enable-decoder=mp3on4float
      - --enable-decoder=libvorbis
      - --enable-decoder=flac
      - --enable-decoder=libopus
      - --enable-decoder=speex
      - --enable-decoder=ac3
      - --enable-decoder=ac3_fixed
      - --enable-decoder=eac3
      - --enable-decoder=srt
      - --enable-decoder=subrip
      - --enable-decoder=ass
      - --enable-decoder=ssa
      - --enable-decoder=webvtt
      - --enable-decoder=vplayer
      - --enable-decoder=microdvd
      - --enable-muxer=mp3
      - --enable-muxer=ogg
      - --enable-muxer=wav
      - --enable-muxer=flac
      - --enable-muxer=srt
      - --enable-muxer=ass
      - --enable-muxer=webvtt
      - --enable-demuxer=aac
      - --enable-demuxer=mp3
      - --enable-demuxer=mov
      - --enable-demuxer=ogg
      - --enable-demuxer=matroska
      - --enable-demuxer=flac
      - --enable-demuxer=wav
      - --enable-demuxer=mpegvideo
      - --enable-demuxer=srt
      - --enable-demuxer=ass
      - --enable-demuxer=webvtt
      - --enable-demuxer=microdvd
      - --enable-parser=aac
      - --enable-parser=aac_latm
      - --enable-parser=ac3
      - --enable-libmp3lame
      - --enable-libvorbis
      - --enable-libopus
      - --enable-librubberband
      - --extra-libs=-lvorbis -logg -lm
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz
        sha256: de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f
      - type: patch
        path: ../patches/ffmpeg.patch

  - name: opencl-headers
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/KhronosGroup/OpenCL-Headers.git
        commit: 4fdcfb0ae675f2f63a9add9552e0af62c2b4ed30

  - name: clblast
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    build-options:
      no-debuginfo: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DTUNERS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/CNugteren/CLBlast/archive/refs/tags/1.6.3.tar.gz
        sha256: c05668c7461e8440fce48c9f7a8966a6f9e0923421acd7c0357ece9b1d83f20e

  - name: spirvheaders
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSPIRV_HEADERS_ENABLE_TESTS=OFF
      - -DSPIRV_HEADERS_ENABLE_INSTALL=ON
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.350.1.tar.gz
        sha256: 9e6d5c78878172d2b810e97f3a74ecbbb14b4ad52b07384ce915fbbeb226d610

  - name: whispercpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_C_FLAGS=-ffast-math -fno-finite-math-only 
      - -DCMAKE_CXX_FLAGS=-ffast-math -fno-finite-math-only 
      - -DGGML_NATIVE=OFF
      - -DGGML_CPU=ON
      - -DGGML_CPU_ALL_VARIANTS=ON
      - -DGGML_BACKEND_DL=ON
      - -DGGML_BACKEND_DIR=/app/lib
      - -DGGML_BLAS=ON
      - -DGGML_BLAS_VENDOR=OpenBLAS
      - -DGGML_CUDA=OFF
      - -DGGML_HIP=OFF 
      - -DGGML_VULKAN=ON
      - -DGGML_OPENCL=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.1.tar.gz
