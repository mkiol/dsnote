id: net.mkiol.SpeechNote.Addon.nvidia
runtime: net.mkiol.SpeechNote
sdk: org.kde.Sdk//6.10
build-extension: true
build-options:
  no-debuginfo: true
  prefix: /app/extensions/nvidia
cleanup:
  - /bin
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/cmake
  - /share/pkgconfig
  - "*.a"
modules:
  - name: cuda
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - sh cuda_13.0.3_580.126.20_linux.run --target ./ --noexec
      - rm -rf builds/*.*
      - rm -rf builds/bin builds/cuda_sanitizer_api builds/integration
      - rm -rf builds/nsight_compute builds/nsight_systems builds/cuda_gdb builds/cuda_documentation
      - mkdir -p ${FLATPAK_DEST}/cuda
      - |
        set -e
        for f in $(find . -name "*.a" | grep -v "libcudart_static.a" | grep -P "static\.a|static_nocallback"); do
          echo "removing $f"
          rm -f "$f"
        done
      - |
        set -e
        cd builds
        for f in *; do
          echo "copying $f => ${FLATPAK_DEST}/cuda/"
          if [ -d $f ]; then
            cp -r $f/* ${FLATPAK_DEST}/cuda/
          else
            cp -P $f ${FLATPAK_DEST}/cuda/
          fi
        done
      - |
        set -e
        cd builds/cuda_cupti/extras/CUPTI/lib64
        for f in libcupti.so*; do
          echo "copying $f => ${FLATPAK_DEST}/cuda/lib64/"
          cp -P $f ${FLATPAK_DEST}/cuda/lib64/
        done
      - rm -rf builds
      - rm -rf cuda_13.0.3_580.126.20_linux.run
      - patch --unified -i "$(realpath .)"/cuda-math-functions.patch /app/extensions/nvidia/cuda/include/crt/math_functions.h
      - ${FLATPAK_DEST}/cuda/bin/nvcc nvcc -arch-ls -code-ls
    build-options:
      strip: true
    cleanup:
      - /cuda/doc
      - /cuda/bin
      - /cuda/extras
      - /cuda/gds*
      - /cuda/include
      - /cuda/libnvvp
      - /cuda/nsight*
      - /cuda/nv*
      - /cuda/pkg-config
      - /cuda/src
      - /cuda/usr
      - /cuda/cublas_version.txt
      - /cuda/LICENSE
      - /cuda/targets/x86_64-linux/lib/cmake
      - /cuda/targets/x86_64-linux/lib/lib64
      - /cuda/targets/x86_64-linux/lib/libOpenCL.so*
      - /cuda/targets/x86_64-linux/lib/libcusolver.so*
      - /cuda/targets/x86_64-linux/lib/libnppif.so*
      - /cuda/targets/x86_64-linux/lib/libcusolverMg.so*
      #- /cuda/targets/x86_64-linux/lib/libcufile*.so*
      - /cuda/targets/x86_64-linux/lib/libcuinj64.so*
      - /cuda/targets/x86_64-linux/lib/libaccinj64.so*
      - /cuda/targets/x86_64-linux/include
      - /cuda/targets/x86_64-linux/res
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/13.0.3/local_installers/cuda_13.0.3_580.126.20_linux.run
        sha256: 79c82c6529d2adfc322336f37b2a7a856655cd739b4803d0af7344db5a69638b
      - type: file
        path: ../patches/cuda-math-functions.patch

  - name: cudnn
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      strip: true
    cleanup:
      - /cuda/targets/x86_64-linux/lib/libcudnn_*train*
      - /cuda/targets/x86_64-linux/include
      - /cuda/include
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/cuda/include
      - |
        set -e
        for f in $(find . -name "*.a"); do
          echo "removing $f"
          rm -f "$f"
        done
      - |
        set -e
        cd include
        for f in *; do
          echo "copying $f => ${FLATPAK_DEST}/cuda/include"
          cp -P $f ${FLATPAK_DEST}/cuda/include/
        done
      - mkdir -p ${FLATPAK_DEST}/cuda/targets/x86_64-linux/lib
      - |
        set -e
        cd lib
        for f in *; do
          echo "copying $f => ${FLATPAK_DEST}/cuda/targets/x86_64-linux/lib"
          cp -P $f ${FLATPAK_DEST}/cuda/targets/x86_64-linux/lib/
        done
    sources:
      - type: archive
        url: https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-9.20.0.48_cuda13-archive.tar.xz
        sha256: 73f091ee57668dc18e8b1b61811c0ddff2ec0b762efe613e9f27f9ebfd6c20c0

  - name: whispercpp-cuda
    only-arches:
      - x86_64
    cleanup:
      - /lib/libggml.so*
      - /lib/libggml-base*
      - /lib/libparakeet*
      - /lib/libwhisper*
    buildsystem: cmake-ninja
    build-options:
      env:
        NVCC_APPEND_FLAGS: --compress-mode=size --split-compile=0 -Wno-deprecated-gpu-targets
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCUDAToolkit_ROOT=/app/extensions/nvidia/cuda
      - -DCMAKE_CUDA_COMPILER=/app/extensions/nvidia/cuda/bin/nvcc
      - -DCMAKE_C_FLAGS=-ffast-math -fno-finite-math-only -I/app/extensions/nvidia/include
      - -DCMAKE_CXX_FLAGS=-ffast-math -fno-finite-math-only -I/app/extensions/nvidia/include
      - -DGGML_NATIVE=OFF
      - -DGGML_CPU=OFF
      - -DGGML_BACKEND_DL=ON
      - -DGGML_BACKEND_DIR=/app/extensions/nvidia/lib
      - -DGGML_BLAS=OFF
      - -DGGML_CUDA=ON
      - -DCMAKE_CUDA_ARCHITECTURES=75;80;86;87;88;89;90;100;103;110;120;121
      - -DGGML_HIP=OFF 
      - -DGGML_VULKAN=OFF
      - -DGGML_OPENCL=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.1.tar.gz
        sha256: 147267177eef7b22ec3d2476dd514d1b12e160e176230b740e3d1bd600118447
      - type: patch
        path: ../patches/whispercpp.patch

  - name: python3-pybind11
    only-arches:
      - x86_64
    buildsystem: simple
    cleanup:
      - /bin
      - /lib/python3.13/site-packages/pybind11*
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "pybind11" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b3/06/c3a23c9a0263b136c519f033a58d4641e73065fefc7754e9667ec206d992/pybind11-3.0.4-py3-none-any.whl
        sha256: 961720ee652da51d531b7b2451a6bd2bc042b0106e6d9baa48ecb7d58034ce63

  - name: oneapi
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      strip: true
    cleanup:
      - /oneapi
    build-commands:
      - sh l_BaseKit_p_2024.0.0.49564_offline.sh --extract-folder ./oneapi -a --eula accept --silent --install-dir ${FLATPAK_DEST}/oneapi
      - chmod -R +w ${FLATPAK_DEST}/oneapi && echo "done" || echo "done with errors"
      - |
        set -e
        for f in $(find ${FLATPAK_DEST}/oneapi -type f -name "*.so*"); do
          echo "removing $f"
          rm -f "$f"
        done
    sources:
      - type: file
        url: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/20f4e6a1-6b0b-4752-b8c1-e5eacba10e01/l_BaseKit_p_2024.0.0.49564_offline.sh
        sha256: f6613cb9c79fbf61c2e541144b8d5c70be845e071f29feb5686b64481528276d

  - name: onednn
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    build-options:
      strip: true
    cleanup:
      - /bin
      - /include
      - /share/doc
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DONEDNN_LIBRARY_TYPE=STATIC
      - -DONEDNN_BUILD_EXAMPLES=OFF
      - -DONEDNN_BUILD_TESTS=OFF
      - -DONEDNN_ENABLE_WORKLOAD=INFERENCE
      - -DONEDNN_ENABLE_PRIMITIVE=CONVOLUTION;REORDER
      - -DONEDNN_BUILD_GRAPH=OFF
    sources:
      - type: archive
        url: https://github.com/uxlfoundation/oneDNN/archive/refs/tags/v3.12.2.tar.gz
        sha256: d16dc7ceb69d5856f3974cab4384f3076f9732f70313b581a351a3a8eef8a642

  - name: ctranslate2-cuda
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    build-options:
      env:
        PYTHONPATH: /app/extensions/nvidia/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
        CTRANSLATE2_ROOT: /app/extensions/nvidia
        NVCC_APPEND_FLAGS: --compress-mode=size --split-compile=0 -Wno-deprecated-gpu-targets
    cleanup:
      - /bin
      - /include
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_CLI=OFF
      - -DCUDA_DYNAMIC_LOADING=ON
      - -DWITH_CUDA=ON
      - -DWITH_CUDNN=ON
      - -DOPENMP_RUNTIME=COMP
      - -DCUDA_ARCH_LIST=7.5 8.0 8.6 8.7 8.9 8.9 9.0
      - -DCUDA_NVCC_FLAGS=-gencode;arch=compute_100,code=sm_100;-gencode;arch=compute_103,code=sm_103;-gencode;arch=compute_110,code=sm_110;-gencode;arch=compute_120,code=sm_120;-gencode;arch=compute_121,code=sm_121
      - -DWITH_MKL=ON
      - -DWITH_DNNL=ON
      - -DWITH_RUY=ON
      - -DCUDA_TOOLKIT_ROOT_DIR=/app/extensions/nvidia/cuda
      - -DINTEL_ROOT=/app/extensions/nvidia
      - -DCMAKE_CXX_FLAGS=-msse4.1
      - -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,noexecstack
      - -DCMAKE_SYSTEM_PREFIX_PATH=/app
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    post-install:
      - cd python && python setup.py bdist_wheel
      - pip3 install --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-build-isolation python/dist/*.whl
      - strip ${FLATPAK_DEST}/lib/libctranslate2.so.4.8.1
    sources:
      - type: git
        url: https://github.com/OpenNMT/CTranslate2.git
        commit: v4.8.1
      - type: patch
        path: ../patches/ctranslate2.patch

  - name: python3-torch-cuda
    only-arches:
      - x86_64
    buildsystem: simple
    cleanup:
      - /bin/convert*
      - /bin/torch*
      - /lib/python3.13/site-packages/nvidia*
      - /lib/python3.13/site-packages/torch/include
    build-options:
      strip: true
      env:
        PYTHONPATH: /app/extensions/nvidia/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} torch torchaudio triton --no-build-isolation
    post-install:
      - |
        set -e
        sp_dir="${FLATPAK_DEST}/lib/python3.13/site-packages"
        cudalib_dir="${FLATPAK_DEST}/cuda/lib64"
        libs_to_copy=(nccl cusparselt nvshmem)
        for lib in "${libs_to_copy[@]}"; do
          for f in "${sp_dir}/nvidia/${lib}/lib"/lib*.so*; do
            echo "coping $f => ${cudalib_dir}"
            cp -P "$f" "${cudalib_dir}"
          done
        done
        for f in $(find ${sp_dir} -maxdepth 1 -name "nvidia*"); do
          echo "removing $f"
          rm -rf "$f"
        done
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/49/8a/94bdecd13f5aaa90d45920b89789d9fe7c6f4af8c3cdd7ce01fcb59908fc/torch-2.12.0-cp313-cp313-manylinux_2_28_x86_64.whl
