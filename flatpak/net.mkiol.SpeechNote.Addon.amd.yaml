id: net.mkiol.SpeechNote.Addon.amd
runtime: net.mkiol.SpeechNote
sdk: org.kde.Sdk//6.10
build-extension: true
build-options:
  no-debuginfo: true
  prefix: /app/extensions/amd
cleanup:
  - /bin
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/cmake
  - /share/pkgconfig
  - "*.a"
modules:
  - name: rocm
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - bash rocm-installer_1.2.9.70204-62-93~24.04.run untar .
      - mv rocm-7.2.4 "${FLATPAK_DEST}/rocm"
      - mkdir -p "${FLATPAK_DEST}/lib"
      - ln -s /usr/lib/x86_64-linux-gnu/libxml2.so "${FLATPAK_DEST}/lib/libxml2.so.2"
    build-options:
      strip: true
    cleanup:
      - /rocm/.info
      - /rocm/bin
      - /rocm/share/amd*
      - /rocm/share/doc
      - /rocm/share/dec
      - /rocm/share/hip
      - /rocm/share/hipfort
      - /rocm/share/html
      - /rocm/share/info
      - /rocm/share/man
      - /rocm/share/mivisionx
      - /rocm/share/modulefiles
      - /rocm/share/openmp-extras
      - /rocm/share/pkgconfig
      - /rocm/share/rccl
      - /rocm/share/rdhc
      - /rocm/share/rocdecode
      - /rocm/share/rocgdb
      - /rocm/share/rocjpg
      - /rocm/share/rocm*
      - /rocm/share/rocprofiler*
      - /rocm/share/rocmcmakebuildtools
      - /rocm/share/rocprofiler*
      - /rocm/share/modulefiles
      - /rocm/include
      - /rocm/lib/cmake
      - /rocm/lib/rocmmod
      - /rocm/lib/CMakeFiles
      - /rocm/lib/llvm/lib-debug
      - /rocm/lib/llvm/share
      - /rocm/lib/llvm/lib/cmake
      - /rocm/lib/python*
      - /rocm/lib/rocprofiler*
      - /rocm/lib/roctracer
      - /rocm/lib/rocmod
      - /rocm/lib/.*
      - /rocm/lib/*.a
      - /rocm/libexec
      - /rocm/llvm
      - /lib/libxml2*
    sources:
      - type: file
        url: https://repo.radeon.com/rocm/installer/rocm-runfile-installer/rocm-rel-7.2.4/ubuntu/24.04/rocm-installer_1.2.9.70204-62-93~24.04.run
        sha256: 866779bfcdc24863c58fe7d8f8cfe21e9e20dc978ce77a153af64e1038f0ab5b

  - name: whispercpp-hip
    only-arches:
      - x86_64
    cleanup:
      - /lib/libggml.so*
      - /lib/libggml-base*
      - /lib/libparakeet*
      - /lib/libwhisper*
    buildsystem: cmake-ninja
    build-options:
      append-ld-library-path: /app/extensions/amd/lib
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_C_FLAGS=-ffast-math -fno-finite-math-only -I/app/extensions/amd/include
      - -DCMAKE_CXX_FLAGS=-ffast-math -fno-finite-math-only -I/app/extensions/amd/include
      - -DGGML_NATIVE=OFF
      - -DGGML_CPU=OFF
      - -DGGML_BACKEND_DL=ON
      - -DGGML_BACKEND_DIR=/app/extensions/amd/lib
      - -DGGML_BLAS=OFF
      - -DGGML_HIP=ON
      - -DCMAKE_HIP_ARCHITECTURES=gfx900;gfx906;gfx908;gfx1010;gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201
      - -DCMAKE_HIP_COMPILER=/app/extensions/amd/rocm/llvm/bin/clang
      - -DCMAKE_PREFIX_PATH=/app/extensions/amd/rocm
      - -DCMAKE_HIP_PLATFORM=amd
      - -DGGML_CUDA=OFF 
      - -DGGML_VULKAN=OFF
      - -DGGML_OPENCL=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.1.tar.gz
        sha256: 147267177eef7b22ec3d2476dd514d1b12e160e176230b740e3d1bd600118447
      - type: patch
        path: ../patches/whispercpp.patch

  - name: python3-pybind11
    only-arches:
      - x86_64
    buildsystem: simple
    cleanup:
      - /bin
      - /lib/python3.13/site-packages/pybind11*
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "pybind11" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b3/06/c3a23c9a0263b136c519f033a58d4641e73065fefc7754e9667ec206d992/pybind11-3.0.4-py3-none-any.whl
        sha256: 961720ee652da51d531b7b2451a6bd2bc042b0106e6d9baa48ecb7d58034ce63

  - name: oneapi
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      strip: true
    cleanup:
      - /oneapi
    build-commands:
      - sh l_BaseKit_p_2024.0.0.49564_offline.sh --extract-folder ./oneapi -a --eula accept --silent --install-dir ${FLATPAK_DEST}/oneapi
      - chmod -R +w ${FLATPAK_DEST}/oneapi && echo "done" || echo "done with errors"
      - |
        set -e
        for f in $(find ${FLATPAK_DEST}/oneapi -type f -name "*.so*"); do
          echo "removing $f"
          rm -f "$f"
        done
    sources:
      - type: file
        url: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/20f4e6a1-6b0b-4752-b8c1-e5eacba10e01/l_BaseKit_p_2024.0.0.49564_offline.sh
        sha256: f6613cb9c79fbf61c2e541144b8d5c70be845e071f29feb5686b64481528276d

  - name: onednn
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    build-options:
      strip: true
    cleanup:
      - /bin
      - /include
      - /share/doc
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DONEDNN_LIBRARY_TYPE=STATIC
      - -DONEDNN_BUILD_EXAMPLES=OFF
      - -DONEDNN_BUILD_TESTS=OFF
      - -DONEDNN_ENABLE_WORKLOAD=INFERENCE
      - -DONEDNN_ENABLE_PRIMITIVE=CONVOLUTION;REORDER
      - -DONEDNN_BUILD_GRAPH=OFF
    sources:
      - type: archive
        url: https://github.com/uxlfoundation/oneDNN/archive/refs/tags/v3.12.2.tar.gz
        sha256: d16dc7ceb69d5856f3974cab4384f3076f9732f70313b581a351a3a8eef8a642

  - name: ctranslate2-hip
    only-arches:
      - x86_64
    buildsystem: cmake-ninja
    build-options:
      append-ld-library-path: /app/extensions/amd/lib
      env:
        PYTHONPATH: /app/extensions/amd/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
        CTRANSLATE2_ROOT: /app/extensions/amd
        ROCM_PATH: /app/extensions/amd/rocm
    cleanup:
      - /bin
      - /include
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_CLI=OFF
      - -DWITH_HIP=ON
      - -DOPENMP_RUNTIME=COMP
      - -DCMAKE_HIP_ARCHITECTURES=gfx900;gfx906;gfx908;gfx1010;gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201
      - -DCMAKE_HIP_COMPILER=/app/extensions/amd/rocm/llvm/bin/clang
      - -DCMAKE_CXX_COMPILER=/app/extensions/amd/rocm/llvm/bin/clang
      - -DCMAKE_C_COMPILER=/app/extensions/amd/rocm/llvm/bin/clang
      - -DCMAKE_PREFIX_PATH=/app/extensions/amd/rocm
      - -DCMAKE_HIP_PLATFORM=amd
      - -DWITH_MKL=ON
      - -DWITH_DNNL=ON
      - -DWITH_RUY=ON
      - -DINTEL_ROOT=/app/extensions/amd
      - -DCMAKE_CXX_FLAGS=-msse4.1 -Wno-deprecated-literal-operator
      - -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,noexecstack
      - -DCMAKE_SYSTEM_PREFIX_PATH=/app
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    post-install:
      - cd python && python setup.py bdist_wheel
      - pip3 install --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-build-isolation python/dist/*.whl
      - strip ${FLATPAK_DEST}/lib/libctranslate2.so.4.8.1
    sources:
      - type: git
        url: https://github.com/OpenNMT/CTranslate2.git
        commit: v4.8.1
      - type: patch
        path: ../patches/ctranslate2.patch

  - name: python3-torch-rocm
    only-arches:
      - x86_64
    buildsystem: simple
    cleanup:
      - /bin/convert*
      - /bin/torch*
      - /lib/python3.13/site-packages/torch/lib/rocblas
      - /lib/python3.13/site-packages/torch/lib/libamd*
      - /lib/python3.13/site-packages/torch/lib/libroc*
      - /lib/python3.13/site-packages/torch/lib/libhip*
      - /lib/python3.13/site-packages/torch/lib/libhsa*
      - /lib/python3.13/site-packages/torch/lib/libMIOpen*
      - /lib/python3.13/site-packages/torch/lib/librccl*
      - /lib/python3.13/site-packages/torch/lib/libnuma*
      - /lib/python3.13/site-packages/torch/lib/hipblas*
      - /lib/python3.13/site-packages/torch/lib/msccl-algorithms
      - /lib/python3.13/site-packages/torch/include
    build-options:
      env:
        PYTHONPATH: /app/extensions/amd/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-deps torch torchaudio triton-rocm --no-build-isolation
    sources:
      - type: file
        url: https://download-r2.pytorch.org/whl/rocm7.2/torch-2.12.0%2Brocm7.2-cp313-cp313-manylinux_2_28_x86_64.whl
        dest-filename: torch-2.12.0+rocm7.2-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 58c07e4cc60c1c47d96bbffb9222f47c1090fc5dea8d9418146d2508a87b785e
      - type: file
        url: https://download-r2.pytorch.org/whl/rocm7.2/torchaudio-2.11.0%2Brocm7.2-cp313-cp313-manylinux_2_28_x86_64.whl
        dest-filename: torchaudio-2.11.0+rocm7.2-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 9228e1c534d04d80fa7b46205f448da947fd06f5573ba8602f041b504edb3596
      - type: file
        url: https://download-r2.pytorch.org/whl/triton_rocm-3.6.0-cp313-cp313-linux_x86_64.whl
        sha256: d43b44f045d7f78d1dfe03b2debce36e0d756041a853633a2677ce5a890a269e

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: net.mkiol.SpeechNote.Addon.amd.metainfo.xml
